<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès aux Solutions Python</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .logo p {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1.05rem;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0284c7;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #7f1d1d;
      color: #fecaca;
      display: block;
    }

    .message.success {
      background: #14532d;
      color: #bbf7d0;
      display: block;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Solutions Python</h1>
      <p>Accès réservé aux possesseurs du livre</p>
    </div>

    <form id="codeForm">
      <label for="code">Code d’activation</label>
      <input 
        type="text" 
        id="code" 
        name="code" 
        placeholder="Ex : ABC-123-XYZ" 
        required 
        autocomplete="off"
        maxlength="20"
      >
      <button type="submit" id="submitBtn">Vérifier le code</button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer">
      Entrez le code unique présent dans votre livre
    </div>
  </div>

  <script>
    const form = document.getElementById('codeForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const code = document.getElementById('code').value.trim().toUpperCase();

      if (!code) return;

      // Réinitialiser le message
      message.className = 'message';
      message.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Vérification...';

      try {
        const response = await fetch('/api/verify-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ code })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          message.className = 'message success';
          message.textContent = 'Code valide ! Redirection...';
          message.style.display = 'block';

          // Sauvegarder l'accès dans le navigateur
          localStorage.setItem('access_granted', 'true');
          localStorage.setItem('access_code', code);

          // Redirection vers la page des solutions
          setTimeout(() => {
            window.location.href = '/solutions.html';
          }, 1200);
        } else {
          message.className = 'message error';
          message.textContent = data.error || 'Code invalide ou déjà utilisé';
          message.style.display = 'block';
        }
      } catch (err) {
        message.className = 'message error';
        message.textContent = 'Erreur de connexion. Réessayez.';
        message.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Vérifier le code';
      }
    });
  </script>
</body>
</html>
